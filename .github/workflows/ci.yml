name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm boundaries
      - run: pnpm test
      - run: pnpm build

  # Validações de arquitetura preparadas — não bloqueiam ainda (serão exigidas
  # quando o código crescer). Ver ADR-018A.
  architecture:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # imports circulares + dependências proibidas entre workspaces (já ativo)
      - run: pnpm boundaries
      # dependências/exports não utilizados (preparado, não-bloqueante)
      - run: pnpm knip
        continue-on-error: true
      # cobertura mínima por pacote (preparado; thresholds elevados quando houver testes)
      - run: pnpm test:coverage
        continue-on-error: true
